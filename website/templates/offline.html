<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Offline | Wandershots</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 20% 10%, #eef2ff 0, #ffffff 42%, #f8fafc 100%);
            color: #111827;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            width: min(460px, 100%);
            padding: 38px 30px;
            text-align: center;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 28px 80px rgba(15, 23, 42, .12);
            backdrop-filter: blur(10px);
        }
        .logo { width: 74px; height: 74px; object-fit: contain; margin: 0 auto 18px; display: block; }
        .eyebrow {
            margin: 0 0 8px;
            color: #6b7280;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .3em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 12px;
            font-family: Cinzel, Georgia, serif;
            font-size: clamp(1.55rem, 5vw, 2.05rem);
            font-weight: 600;
            letter-spacing: .02em;
        }
        p { margin: 0 auto 22px; max-width: 34ch; color: #4b5563; font-size: 14px; line-height: 1.65; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 10px;
            border: 1px solid #111827;
            background: #111827;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
        }
        .btn.secondary { background: transparent; color: #111827; border-color: #d1d5db; }
        .status { margin-top: 18px; min-height: 18px; color: #6b7280; font-size: 12px; }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="{{ url_for('static', filename='images/wslogo.png') }}" alt="Wandershots" width="74" height="74">
        <p class="eyebrow">Wandershots</p>
        <h1>You are offline</h1>
        <p>Your connection dropped. Cached pages may still be available, but live availability, bookings, and account actions need an internet connection.</p>
        <div class="actions">
            <button type="button" class="btn" id="retry">Try again</button>
            <a class="btn secondary" href="{{ url_for('views.home') }}">Go to home</a>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        (function () {
            var status = document.getElementById('status');
            document.getElementById('retry').addEventListener('click', function () {
                if (navigator.onLine) {
                    window.location.href = '/';
                } else {
                    status.textContent = 'Still offline. Please check your connection.';
                }
            });
            window.addEventListener('online', function () {
                status.textContent = 'Connection restored. You can try again.';
            });
        })();
    </script>
</body>
</html>
