{% extends "base.html" %}
{% block title %}System Error - {{ code }}{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 px-6 -mt-20">
    <div class="max-w-xl w-full text-center">
        
        <!-- Error Code Ring -->
        <div class="w-28 h-28 bg-indigo-50 border border-indigo-100 rounded-full flex flex-col items-center justify-center mx-auto mb-8 shadow-sm">
            <span class="text-4xl font-extrabold text-indigo-600 tracking-tight font-mono">{{ code }}</span>
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2 font-inter">{{ title }}</h1>
        <div class="w-12 h-0.5 bg-indigo-600 mx-auto mb-6"></div>
        
        <p class="text-gray-600 text-base md:text-lg leading-relaxed mb-10 max-w-md mx-auto">
            {{ desc }}
        </p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
            <a href="{{ url_for('views.home') }}" class="w-full sm:w-auto bg-gray-900 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-gray-800 transition-colors shadow-md text-sm uppercase tracking-wider">
                <i class="ri-home-5-line mr-1.5"></i> Return to Website
            </a>
            <button onclick="window.history.back()" class="w-full sm:w-auto bg-white border border-gray-300 text-gray-700 font-bold px-8 py-3.5 rounded-xl hover:bg-gray-50 transition-colors text-sm uppercase tracking-wider">
                <i class="ri-arrow-left-line mr-1.5"></i> Go Back
            </button>
        </div>
        
    </div>
</section>

<!-- Hide the main footer on standalone error views -->
<style>
    footer { display: none !important; }
</style>
{% endblock %}
