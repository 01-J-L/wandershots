{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block extra_meta %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}
<style>
    /* Hides the nav and footer if they have specific IDs or tags */
    nav,
    footer {
        display: none !important;
    }
</style>
<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8 relative">

    <div
        class="max-w-md w-full space-y-8 bg-white p-8 md:p-10 rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 animate-fade-in-down z-10">

        <!-- Header & Logo -->
        <div class="text-center">
            <div
                class="mx-auto w-16 h-16 bg-indigo-50 border border-indigo-100 rounded-full flex items-center justify-center mb-6 shadow-sm">
                <div class="relative w-full h-full flex items-center justify-center">
                    <span class="font-serif-monogram text-2xl text-gray-800 absolute right-1/2 translate-x-1">W</span>
                    <span
                        class="font-serif-monogram italic text-xl text-indigo-600 absolute left-1/2 -translate-x-1 mt-1 font-medium">S</span>
                </div>
            </div>

            <h2 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">Admin Portal</h2>
            <p class="mt-2 text-sm text-gray-500 font-medium">Sign in to manage Wandershots Studios</p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="mt-8 space-y-6">
            <div class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-bold text-gray-700 mb-1.5">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="ri-user-3-line text-gray-400 text-lg"></i>
                        </div>
                        <input id="username" name="username" type="text" required
                            class="appearance-none block w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-xl text-gray-900 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-all sm:text-sm"
                            placeholder="Enter your username">
                    </div>
                </div>
 
                <div>
                    <label for="password" class="block text-sm font-bold text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="ri-lock-password-line text-gray-400 text-lg"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="appearance-none block w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-xl text-gray-900 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-all sm:text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- ADD THIS BLOCK DIRECTLY BELOW THE PASSWORD INPUT: -->
                <div class="flex items-center justify-between mt-4">
                    <label class="flex items-center cursor-pointer select-none">
                        <input type="checkbox" name="remember"
                            class="w-4 h-4 text-indigo-600 bg-gray-50 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-600 font-medium">Remember me</span>
                    </label>
                </div>


            </div>

            <div class="pt-2 space-y-5">
                <button type="submit"
                    class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-md hover:shadow-lg">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i
                            class="ri-login-circle-line text-indigo-300 group-hover:text-indigo-200 transition-colors text-lg"></i>
                    </span>
                    Access Dashboard
                </button>

                <div class="text-center flex flex-col items-center justify-center gap-4 mt-2">
                    <a href="{{ url_for('views.home') }}"
                        class="inline-flex items-center text-sm font-medium text-gray-400 hover:text-indigo-600 transition-colors">
                        <i class="ri-arrow-left-s-line mr-1"></i> Return to Website
                    </a>

                    <!-- Download App Button -->
                    {% if get_setting('admin_apk_filename') %}
                    <a href="{{ url_for('static', filename='apps/' + get_setting('admin_apk_filename')) }}" download
                        class="inline-flex items-center px-5 py-2 border border-gray-200 shadow-sm text-xs font-bold rounded-full text-emerald-700 bg-emerald-50 hover:bg-emerald-100 focus:outline-none transition-all mt-2">
                        <i class="ri-android-line mr-1.5 text-lg"></i> Download Android App (APK)
                    </a>
                    {% endif %}
                </div>
            </div>
        </form>
    </div>
</section>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.querySelector('input[name="remember"]');

        if (!usernameInput || !passwordInput || !rememberCheckbox) return;

        // 1. Automatically fill both fields on load if credentials were saved
        const savedUsername = localStorage.getItem('remembered_admin_username');
        const savedPassword = localStorage.getItem('remembered_admin_password');
        
        if (savedUsername) {
            usernameInput.value = savedUsername;
            rememberCheckbox.checked = true;
        }
        if (savedPassword) {
            passwordInput.value = savedPassword;
        }

        // 2. Helper function to save or clear credentials in real-time
        function saveCredentialsRealtime() {
            if (rememberCheckbox.checked) {
                localStorage.setItem('remembered_admin_username', usernameInput.value);
                localStorage.setItem('remembered_admin_password', passwordInput.value);
            } else {
                localStorage.removeItem('remembered_admin_username');
                localStorage.removeItem('remembered_admin_password');
            }
        }

        // 3. Listen to input and state changes in real-time
        usernameInput.addEventListener('input', saveCredentialsRealtime);
        passwordInput.addEventListener('input', saveCredentialsRealtime);
        rememberCheckbox.addEventListener('change', saveCredentialsRealtime);
    });
</script>

<script>
    // Existing PWA Installation script (Keep this as is)
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        if(installBtn) installBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if(installBtn) {
            installBtn.style.display = 'inline-flex';
            installBtn.classList.remove('hidden');
        }
    });

    if(installBtn) {
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("To install the Admin App on iOS:\n\n1. Tap the 'Share' icon at the bottom of Safari.\n2. Scroll down and select 'Add to Home Screen'.");
            }
        });
    }

    window.addEventListener('appinstalled', () => {
        if(installBtn) installBtn.style.display = 'none';
    });
</script>
{% endblock %}
